<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo · Ser FM Carnerillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#150c34;
    --bg-deep-2:#1e1250;
    --panel:#241854;
    --panel-2:#2c1e66;
    --gold:#ffc857;
    --gold-soft:#ffdf99;
    --pink:#ff3e7f;
    --cyan:#33e6c6;
    --text-light:#f6f3ff;
    --text-dim:#b9aedd;
    --line:rgba(255,255,255,0.08);
    --font-display:'Baloo 2', system-ui, sans-serif;
    --font-body:'Manrope', system-ui, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,200,87,0.10), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(255,62,127,0.14), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(51,230,198,0.08), transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
    background-attachment:fixed;
    color:var(--text-light);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 18px 60px;
    overflow-x:hidden;
    position:relative;
  }

  /* faint speaker-mesh dot texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:22px 22px;
    pointer-events:none;
    opacity:.5;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:980px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    text-align:center;
    margin-bottom:26px;
  }

  .station{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-display);
    font-weight:700;
    letter-spacing:.5px;
    color:var(--gold);
    background:rgba(255,200,87,0.08);
    border:1px solid rgba(255,200,87,0.28);
    padding:7px 18px;
    border-radius:999px;
    font-size:14px;
    text-transform:uppercase;
  }
  .station .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--pink);
    box-shadow:0 0 10px var(--pink);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(.7);}
  }

  h1{
    font-family:var(--font-display);
    font-size:clamp(28px, 5vw, 46px);
    margin:16px 0 6px;
    font-weight:800;
    letter-spacing:.5px;
  }
  h1 span{color:var(--pink);}

  .subtitle{
    color:var(--text-dim);
    font-size:15px;
    margin:0;
  }
  .subtitle b{color:var(--gold-soft); font-weight:700;}

  /* ===== STAGE ===== */
  .stage{
    width:100%;
    display:grid;
    grid-template-columns:1fr 210px;
    gap:22px;
    align-items:stretch;
    margin-top:8px;
  }
  @media (max-width:680px){
    .stage{grid-template-columns:1fr; }
  }

  .reel-card{
    position:relative;
    background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    border-radius:26px;
    padding:38px 30px;
    min-height:230px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.55);
  }

  .reel-card::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.05) 1.4px, transparent 1.4px);
    background-size:16px 16px;
    opacity:.5;
  }

  .reel-eyebrow{
    position:relative;
    font-family:var(--font-display);
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--cyan);
    margin-bottom:14px;
    opacity:.85;
  }

  .reel-name{
    position:relative;
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(26px, 4.4vw, 40px);
    line-height:1.15;
    color:var(--text-light);
    transition:transform .05s;
  }

  .reel-comment{
    position:relative;
    margin-top:10px;
    font-size:clamp(14px, 2vw, 17px);
    color:var(--text-dim);
    font-style:italic;
    max-width:520px;
  }

  .reel-idle .reel-name{color:var(--text-dim); font-weight:600;}

  .reel-card.spinning{
    animation:cardshake .12s linear infinite;
  }
  @keyframes cardshake{
    0%{transform:translate(0,0);}
    25%{transform:translate(1px,-1px);}
    50%{transform:translate(-1px,1px);}
    75%{transform:translate(1px,1px);}
    100%{transform:translate(0,0);}
  }

  .reel-card.winner{
    animation:none;
    border-color:rgba(255,200,87,0.6);
    box-shadow:0 0 0 1px rgba(255,200,87,0.3), 0 30px 60px -20px rgba(255,62,127,0.35);
  }
  .reel-card.winner .reel-name{
    color:var(--gold);
    transform:scale(1.14);
    text-shadow:0 0 26px rgba(255,200,87,0.55);
  }
  .reel-card.winner .reel-comment{
    color:var(--text-light);
    transform:scale(1.05);
  }

  .congrats{
    position:relative;
    font-family:var(--font-display);
    font-weight:800;
    font-size:0;
    color:var(--pink);
    letter-spacing:1px;
    margin-bottom:0;
    max-height:0;
    overflow:hidden;
    transition:all .35s ease;
    text-shadow:0 0 24px rgba(255,62,127,0.5);
  }
  .congrats.show{
    font-size:clamp(20px, 3.4vw, 30px);
    margin-bottom:12px;
    max-height:80px;
  }

  /* ===== DIAL / COUNTDOWN ===== */
  .dial-panel{
    background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    border-radius:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:20px 12px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.55);
  }

  .dial-label{
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  .dial{
    position:relative;
    width:150px;
    height:150px;
  }
  .dial svg{ transform:rotate(-90deg); }
  .dial-track{ fill:none; stroke:rgba(255,255,255,0.08); stroke-width:10; }
  .dial-progress{
    fill:none;
    stroke:url(#dialGradient);
    stroke-width:10;
    stroke-linecap:round;
    stroke-dasharray:408;
    stroke-dashoffset:0;
    transition:stroke-dashoffset .85s linear;
    filter:drop-shadow(0 0 8px rgba(255,200,87,0.55));
  }
  .dial-number{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:800;
    font-size:56px;
    color:var(--gold);
  }
  .dial-number.pop{ animation:pop .3s ease; }
  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.35);}
    100%{transform:scale(1);}
  }

  /* ===== BUTTON ===== */
  .action-row{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }

  .btn-sortear{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:.5px;
    color:#241455;
    background:linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
    border:none;
    padding:18px 46px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 14px 30px -10px rgba(255,200,87,0.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s;
  }
  .btn-sortear:hover:not(:disabled){
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 18px 36px -10px rgba(255,200,87,0.7);
  }
  .btn-sortear:active:not(:disabled){ transform:translateY(0) scale(.98); }
  .btn-sortear:disabled{ opacity:.55; cursor:default; }

  .pool-count{
    color:var(--text-dim);
    font-size:13px;
  }
  .pool-count b{ color:var(--cyan); }

  .winners-note{
    margin-top:22px;
    font-size:13px;
    color:var(--text-dim);
    text-align:center;
    max-width:480px;
  }

  canvas#confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
  }

  footer{
    margin-top:44px;
    color:var(--text-dim);
    font-size:12px;
    opacity:.7;
    text-align:center;
  }

  @media (prefers-reduced-motion:reduce){
    .reel-card.spinning{ animation:none; }
    .dial-number.pop{ animation:none; }
    .station .dot{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="wrap">
  <header>
    <div class="station"><span class="dot"></span> Ser FM Carnerillo</div>
    <h1>Sorteo <span>en vivo</span> 🎙️</h1>
    <p class="subtitle">Elegimos al azar entre <b id="totalCount">…</b> participantes de la publicación</p>

  <div class="stage">

    <div class="dial-panel">
      <div class="dial-label">Sintonizando</div>
      <div class="dial">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <defs>
            <linearGradient id="dialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffc857"/>
              <stop offset="100%" stop-color="#ff3e7f"/>

          </defs>
          <circle class="dial-track" cx="75" cy="75" r="65"></circle>
          <circle class="dial-progress" id="dialProgress" cx="75" cy="75" r="65"></circle>
        </svg>
        <div class="dial-number" id="dialNumber">5</div>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-sortear" id="sortearBtn">¡SORTEAR!</button>
    <div class="pool-count" id="poolCount"></div>
  </div>

  <p class="winners-note" id="winnersNote"></p>

  <footer>Sorteo generado a partir de los comentarios de la publicación · Ser FM Carnerillo</footer>
</div>

  const sortearBtn = document.getElementById('sortearBtn');

  const DIAL_CIRC = 2 * Math.PI * 65; // ~408.4
  dialProgress.style.strokeDasharray = DIAL_CIRC;

  function setDial(step){ // step: 5..0
    dialNumber.textContent = step;
    dialNumber.classList.remove('pop');
    void dialNumber.offsetWidth;
    dialNumber.classList.add('pop');
    const frac = step / 5;
    dialProgress.style.strokeDashoffset = DIAL_CIRC * (1 - frac);
  }
  setDial(5);

  // ---------- Sound (Web Audio, synthesized — no external files) ----------
  let actx = null;
  function ctx(){
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(actx.state === 'suspended'){ actx.resume(); }
    return actx;
  }

  function tick(freq){
    try{
      const c = ctx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'square';
      osc.frequency.value = freq || 900;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.linearRampToValueAtTime(0.16, c.currentTime + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.09);
      osc.connect(gain).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + 0.1);
    }catch(e){}
  }

  function countBeep(){
    try{
      const c = ctx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = 520;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.linearRampToValueAtTime(0.22, c.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.22);
      osc.connect(gain).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + 0.22);
    }catch(e){}
  }

  function fanfare(){
    try{
      const c = ctx();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const start = c.currentTime + i * 0.12;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
        osc.connect(gain).connect(c.destination);
        osc.start(start);
        osc.stop(start + 0.55);
      });
    }catch(e){}
  }

  // ---------- Confetti ----------
  const canvas = document.getElementById('confetti');
  const cctx = canvas.getContext('2d');
  let confettiParticles = [];
  let confettiRAF = null;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const CONFETTI_COLORS = ['#ffc857', '#ff3e7f', '#33e6c6', '#f6f3ff', '#ffdf99'];

  function launchConfetti(){
    const count = 160;
    for(let i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.3,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 10,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        vy: 2 + Math.random() * 3.5,
        vx: -2 + Math.random() * 4,
        rot: Math.random() * 360,
        vrot: -8 + Math.random() * 16,
        life: 0,
        maxLife: 220 + Math.random() * 80
      });
    }
    if(!confettiRAF){ animateConfetti(); }
  }

  function animateConfetti(){
    cctx.clearRect(0,0,canvas.width, canvas.height);
    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.03;
      p.rot += p.vrot;
      p.life++;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot * Math.PI/180);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cctx.restore();
    });
    confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);
    if(confettiParticles.length > 0){
      confettiRAF = requestAnimationFrame(animateConfetti);
    } else {
      cctx.clearRect(0,0,canvas.width, canvas.height);
      confettiRAF = null;
    }
  }

  // ---------- Draw logic ----------
  let spinning = false;

  function randomEntry(){
    return RAW[Math.floor(Math.random() * RAW.length)];
  }

  function showEntry(entry, big){
    reelName.textContent = entry.name;
    reelComment.textContent = entry.comment;
  }

  function pickWinner(){
    const idx = Math.floor(Math.random() * pool.length);
    const winner = pool[idx];
    pool.splice(idx, 1);
    return winner;
  }

  function startDraw(){
    if(spinning) return;
    if(pool.length === 0){
      winnersNoteEl.textContent = 'Ya no quedan participantes disponibles para sortear.';
      return;
    }

    spinning = true;
    sortearBtn.disabled = true;
    congratsText.classList.remove('show');
    reelCard.classList.remove('winner');
    reelCard.classList.remove('reel-idle');
    reelCard.classList.add('spinning');
    reelEyebrow.textContent = 'Sorteando…';

    const winner = pickWinner();

    let elapsed = 0;
    const totalDuration = 5000; // ms, matches countdown 5 -> 0
    let speed = 55; // ms between reel changes, starts fast

    function reelStep(){
      if(elapsed >= totalDuration){
        finishDraw(winner);
        return;
      }
      showEntry(randomEntry());
      tick(700 + Math.random()*400);
      speed = Math.min(speed * 1.055, 260); // decelerate like a wheel
      elapsed += speed;
      setTimeout(reelStep, speed);
    }
    reelStep();

    // countdown 5 -> 0, one tick per second, in sync with total duration
    let count = 5;
    setDial(count);
    countBeep();
    const countdownInterval = setInterval(() => {
      count -= 1;
      if(count < 0){
        clearInterval(countdownInterval);
        return;
      }
      setDial(count);
      countBeep();
    }, totalDuration / 5);
  }

  function finishDraw(winner){
    spinning = false;
    winners.push(winner);

    reelCard.classList.remove('spinning');
    reelCard.classList.add('winner');
    reelEyebrow.textContent = 'Ganador/a';
    showEntry(winner, true);
    congratsText.classList.add('show');

    fanfare();
    launchConfetti();
    setTimeout(launchConfetti, 300);

    updatePoolCount();

    sortearBtn.textContent = 'SORTEAR OTRO PREMIO';
    sortearBtn.disabled = pool.length === 0;

    if(pool.length === 0){
      winnersNoteEl.textContent = 'Se sortearon todos los participantes disponibles.';
    } else {
      winnersNoteEl.textContent = '';
    }
  }

  sortearBtn.addEventListener('click', startDraw);

})();
</script>
