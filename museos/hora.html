<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hora</title>
<style>
  @font-face { font-family:'HNBold';  src:url('helvetica-neue-lt-std-bold.ttf') format('truetype'); font-weight:700; }
  @font-face { font-family:'HNLight'; src:url('HelveticaNeueLTPro-Lt.otf') format('opentype'); font-weight:300; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }

  /* Dos solapas pegadas al borde derecho, a la misma altura que la barra de mensajes:
     de la línea celeste (86px desde abajo) al borde inferior de la barra (39px) = 47px de alto.
     Esquina inferior izquierda redondeada (espejo de "TU MENSAJE"), lado derecho recto. */
  .solapa {
    position:fixed; bottom:39px; height:47px;
    display:flex; align-items:center; justify-content:center;
    padding-bottom:8px;                    /* sube el texto 4px respecto del centro exacto */
    white-space:nowrap; line-height:1;
    border-radius:0 0 0 18px;
  }

  /* Temperatura: gris, encima. El conjunto está corrido 120px a la izquierda; el gris se estira hasta el borde
     derecho de la pantalla (240px en total) y el texto queda centrado en los 120px de la izquierda. */
  #caja-temp {
    right:0; width:240px; z-index:2;
    padding-right:120px;
    background:#2F2F2F; color:#FFF5EA;
    font-family:'HNLight',Helvetica,Arial,sans-serif; font-weight:300;
    font-size:32px; letter-spacing:-0.005em;     /* mismo tamaño que la hora; interletrado -5 */
  }

  /* Hora: celeste, por debajo de la temperatura (se asoma hacia la izquierda).
     Mide 24px más que su parte visible (150px) porque queda tapada por la solapa gris. */
  #caja-hora {
    right:216px; width:174px; z-index:1;
    padding-right:24px;
    background:#71CCF0; color:#111314;
    font-family:'HNBold',Helvetica,Arial,sans-serif; font-weight:700;
    font-size:34px; letter-spacing:-0.005em;     /* interletrado -5 */
  }
</style>
</head>
<body>

  <div class="solapa" id="caja-hora"><span id="hora">00:00</span></div>
  <div class="solapa" id="caja-temp"><span id="temp">--.-°</span></div>

<script>
  // Hora de Córdoba, Argentina (formato 00:00, 24 h)
  const fmtHora = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'America/Argentina/Cordoba',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23'
  });

  function actualizarHora() {
    document.getElementById('hora').textContent = fmtHora.format(new Date());
  }

  // Temperatura de Córdoba, Argentina (Open-Meteo, sin clave)
  const URL_CLIMA =
    'https://api.open-meteo.com/v1/forecast?latitude=-31.4201&longitude=-64.1888&current=temperature_2m&timezone=America%2FArgentina%2FCordoba';

  async function actualizarTemp() {
    try {
      const r = await fetch(URL_CLIMA, { cache: 'no-store' });
      const d = await r.json();
      document.getElementById('temp').textContent = d.current.temperature_2m.toFixed(1) + '°';
    } catch (e) {
      // si falla, deja el último valor mostrado
    }
  }

  actualizarHora();
  actualizarTemp();
  setInterval(actualizarHora, 1000);
  setInterval(actualizarTemp, 10 * 60 * 1000); // cada 10 minutos
</script>

</body>
</html>
